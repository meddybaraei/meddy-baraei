<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--bg:#0b1020;--panel:#151c33;--ink:#f3f5fb;--mute:#8d97b5;--amber:#ffb020;--violet:#a78bfa;--teal:#2dd4bf;--red:#ff4d5e;--blue:#60a5fa}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Inter,sans-serif;color:var(--ink)}
#stage{position:absolute;inset:0}
#tint{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,77,94,.35),transparent 70%);opacity:0}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.035) 2px,transparent 2px);background-size:90px 90px}
.brand{position:absolute;top:70px;left:0;right:0;text-align:center;font:700 30px Inter;letter-spacing:6px;color:var(--mute);opacity:.7}
.scene{position:absolute;inset:0;opacity:0}
.a{position:absolute;opacity:0}
.kicker{left:0;right:0;text-align:center;font:600 34px Inter;letter-spacing:8px;color:var(--mute)}
.big{left:70px;right:70px;text-align:center;font:800 100px/1.05 "Inter Display",Inter;letter-spacing:-2px}
.mid{left:70px;right:70px;text-align:center;font:700 62px/1.15 "Inter Display",Inter}
.card{left:100px;right:100px;min-height:190px;border-radius:36px;background:var(--panel);border:4px solid;display:flex;align-items:center;gap:36px;padding:24px 46px;font:800 64px/1.1 "Inter Display",Inter}
.card .n{flex:none;width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 54px Inter;color:var(--bg)}
.chip{left:140px;right:140px;min-height:140px;padding:20px 30px;border-radius:30px;background:var(--panel);display:flex;align-items:center;justify-content:center;text-align:center;font:700 52px/1.2 Inter;border:3px solid rgba(255,255,255,.08)}
.chips{left:80px;right:80px;display:flex;justify-content:center;gap:26px}
.chips div{width:140px;height:140px;border-radius:28px;background:var(--panel);border:3px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font:800 60px "JetBrains Mono"}
.badge{right:90px;padding:16px 32px;border-radius:24px;font:800 52px "JetBrains Mono";background:#000;border:3px solid var(--mute);color:var(--ink)}
.warn{left:90px;right:90px;border-radius:32px;padding:36px 44px;background:rgba(255,77,94,.12);border:4px solid var(--red);font:700 54px/1.25 Inter;text-align:center}
#cap{position:absolute;left:60px;right:60px;bottom:150px;text-align:center;font:700 50px/1.25 Inter;color:#fff}
#cap span{background:rgba(0,0,0,.6);padding:6px 18px;border-radius:14px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
</style></head><body>
<div id="stage"><div class="grid"></div><div id="tint"></div><div class="brand">NOVAPROHOME</div><div id="scenes"></div><div id="cap"></div></div>
<script>
const SPEC={"slug": "porch-lights-sunset-rule", "title": "Dark at 5 PM and Your Porch Is Pitch Black? | Smart Home Fixes #3", "beats": [{"text": "Dark at 5 PM? A lot of porch lights miss one job, and it's not brightness.", "start": 0.461, "end": 4.468}, {"text": "The Sunset Rule. On at sunset, off on a timer.", "start": 4.945, "end": 7.555}, {"text": "And the part most people miss: light the door, not the yard, so your camera sees faces, not shadows.", "start": 8.013, "end": 13.041}, {"text": "Easiest upgrade: a floodlight camera. Light and camera in one.", "start": 13.584, "end": 16.622}, {"text": "Is your porch light on a schedule yet?", "start": 17.172, "end": 18.317}, {"text": "We're a small local business aiming for 100 subscribers by December 31. Subscribing helps a lot.", "start": 18.872, "end": 23.068}, {"text": "Follow for number 4: leak sensors before the first freeze. Free quote at novaprohome.com.", "start": 23.602, "end": 27.943}], "scenes": [{"from": 0, "to": 0, "els": [{"t": "kicker", "top": 170, "html": "SMART HOME FIXES #3", "at": 0}, {"t": "mid", "top": 250, "html": "<svg width=\"760\" height=\"560\" viewBox=\"0 0 760 560\" style=\"display:block;margin:0 auto\"><rect width=\"760\" height=\"560\" rx=\"36\" fill=\"#060912\"/><rect x=\"60\" y=\"120\" width=\"420\" height=\"400\" fill=\"#10162a\"/><rect x=\"250\" y=\"210\" width=\"160\" height=\"300\" rx=\"8\" fill=\"#1d2440\" stroke=\"#2a3358\" stroke-width=\"6\"/><circle cx=\"385\" cy=\"370\" r=\"7\" fill=\"#8d97b5\"/><circle cx=\"330\" cy=\"300\" r=\"34\" fill=\"#151a2b\"/><rect x=\"290\" y=\"336\" width=\"80\" height=\"120\" rx=\"30\" fill=\"#151a2b\"/><rect x=\"168\" y=\"230\" width=\"34\" height=\"50\" rx=\"8\" fill=\"#2a3358\"/><circle cx=\"185\" cy=\"262\" r=\"14\" fill=\"#3a4260\"/><rect x=\"500\" y=\"70\" width=\"160\" height=\"150\" rx=\"16\" fill=\"#000\" stroke=\"#2a3358\" stroke-width=\"4\"/><text x=\"580\" y=\"150\" fill=\"#ff4d5e\" font-size=\"56\" font-family=\"Inter\" font-weight=\"800\" text-anchor=\"middle\">?</text><text x=\"580\" y=\"200\" fill=\"#8d97b5\" font-size=\"22\" font-family=\"Inter\" font-weight=\"700\" text-anchor=\"middle\">TOO DARK</text><text x=\"512\" y=\"96\" fill=\"#ff4d5e\" font-size=\"18\" font-family=\"JetBrains Mono\" font-weight=\"800\">\u25cf CAM</text></svg>", "at": 0}, {"t": "badge", "top": 840, "html": "5:02 PM", "at": 0}, {"t": "chip", "top": 1000, "html": "Misses <span style='color:var(--red)'>one job</span>", "at": 0, "d": 1.6}, {"t": "chip", "top": 1160, "html": "\u2026and it's not brightness", "at": 0, "d": 3.0}]}, {"from": 1, "to": 1, "els": [{"t": "big", "top": 330, "color": "amber", "html": "The Sunset Rule", "at": 1, "pop": true}, {"t": "chip", "top": 620, "html": "1 \u00b7 On at sunset", "at": 1, "d": 1.0}, {"t": "chip", "top": 790, "html": "2 \u00b7 Off on a timer", "at": 1, "d": 2.0}]}, {"from": 2, "to": 2, "els": [{"t": "card", "top": 180, "color": "teal", "n": "3", "html": "Light the door, not the yard", "at": 2}, {"t": "mid", "top": 430, "html": "<svg width=\"760\" height=\"560\" viewBox=\"0 0 760 560\" style=\"display:block;margin:0 auto\"><rect width=\"760\" height=\"560\" rx=\"36\" fill=\"#060912\"/><rect x=\"60\" y=\"120\" width=\"420\" height=\"400\" fill=\"#10162a\"/><radialGradient id=\"g\"><stop offset=\"0\" stop-color=\"#ffd166\" stop-opacity=\".55\"/><stop offset=\"1\" stop-color=\"#ffd166\" stop-opacity=\"0\"/></radialGradient><ellipse cx=\"330\" cy=\"330\" rx=\"260\" ry=\"230\" fill=\"url(#g)\"/><rect x=\"250\" y=\"210\" width=\"160\" height=\"300\" rx=\"8\" fill=\"#1d2440\" stroke=\"#2a3358\" stroke-width=\"6\"/><circle cx=\"385\" cy=\"370\" r=\"7\" fill=\"#8d97b5\"/><circle cx=\"330\" cy=\"300\" r=\"34\" fill=\"#f3d2b3\"/><circle cx=\"319\" cy=\"296\" r=\"4\" fill=\"#222\"/><circle cx=\"341\" cy=\"296\" r=\"4\" fill=\"#222\"/><path d=\"M318 314q12 10 24 0\" stroke=\"#222\" stroke-width=\"3\" fill=\"none\"/><rect x=\"290\" y=\"336\" width=\"80\" height=\"120\" rx=\"30\" fill=\"#5b7cfa\"/><rect x=\"168\" y=\"230\" width=\"34\" height=\"50\" rx=\"8\" fill=\"#2a3358\"/><circle cx=\"185\" cy=\"262\" r=\"14\" fill=\"#ffd166\"/><rect x=\"500\" y=\"70\" width=\"160\" height=\"150\" rx=\"16\" fill=\"#000\" stroke=\"#2a3358\" stroke-width=\"4\"/><circle cx=\"580\" cy=\"128\" r=\"16\" fill=\"#f3d2b3\"/><rect x=\"566\" y=\"146\" width=\"28\" height=\"30\" rx=\"10\" fill=\"#5b7cfa\"/><text x=\"580\" y=\"200\" fill=\"#2dd4bf\" font-size=\"22\" font-family=\"Inter\" font-weight=\"700\" text-anchor=\"middle\">FACE \u2713</text><text x=\"512\" y=\"96\" fill=\"#ff4d5e\" font-size=\"18\" font-family=\"JetBrains Mono\" font-weight=\"800\">\u25cf CAM</text></svg>", "at": 2, "d": 1.8, "pop": true}, {"t": "chip", "top": 1060, "html": "Faces, <span style='color:var(--teal)'>not shadows</span>", "at": 2, "d": 3.6}]}, {"from": 3, "to": 3, "els": [{"t": "card", "top": 330, "color": "blue", "n": "+", "html": "Upgrade: floodlight camera", "at": 3}, {"t": "mid", "top": 640, "html": "\ud83d\udca1 + \ud83d\udcf7<br><span style='color:var(--blue)'>light and camera in one</span>", "at": 3, "d": 1.4}]}, {"from": 4, "to": 6, "els": [{"t": "big", "top": 260, "html": "Is your porch light <span style='color:var(--amber)'>on a schedule</span> yet?", "at": 4, "pop": true}, {"t": "chip", "top": 680, "html": "Goal: <b>100 subscribers</b> by Dec 31", "at": 5}, {"t": "mid", "top": 880, "html": "Follow for <b style='color:var(--teal)'>#4: leak sensors</b><br>before the first freeze", "at": 6}, {"t": "mid", "top": 1110, "html": "Free quote at<br><b style='color:var(--teal)'>novaprohome.com</b>", "at": 6, "d": 2.4}]}]};
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const B=SPEC.beats; // [{text,start,end}]
const root=document.getElementById('scenes');const scenes=[],els=[];
SPEC.scenes.forEach(sc=>{
  const s=document.createElement('div');s.className='scene';root.appendChild(s);
  const a=sc.from===0?-1:B[sc.from].start-0.05,b=sc.to+1<B.length?B[sc.to+1].start-0.15:1e9;scenes.push({s,a,b}); // first scene is on screen from frame 0
  sc.els.forEach(e=>{
    const d=document.createElement('div');d.className='a '+e.t;d.style.top=e.top+'px';
    if(e.color){d.style.borderColor=`var(--${e.color})`;if(e.t!=='card'&&e.t!=='chip'&&e.t!=='warn')d.style.color=`var(--${e.color})`}
    if(e.t==='card')d.innerHTML=`<div class="n" style="background:var(--${e.color})">${e.n}</div><div>${e.html}</div>`;
    else if(e.t==='chips')d.innerHTML=e.items.map(x=>`<div>${x}</div>`).join('');
    else if(e.t==='chip')d.innerHTML=`<div>${e.html}</div>`; // one flex child so inline spans don't split into columns
    else d.innerHTML=e.html;
    s.appendChild(d);
    els.push({d,t:e.at===0&&!e.d?-1:B[e.at].start+(e.d||0),pop:!!e.pop,dim:e.dimAt!=null?B[e.dimAt].start:null});
  });
});
window.render=function(t){
  for(const{s,a,b}of scenes){s.style.opacity=Math.max(0,Math.min(ease((t-a)/.3),1-ease((t-b)/.3)));s.style.transform=`translateY(${(1-ease((t-a)/.4))*40-ease((t-b)/.3)*40}px)`}
  for(const{d,t:ti,pop,dim}of els){const p=(t-ti)/.45;d.style.opacity=ease(p*1.6)*(dim!=null&&t>dim?.35:1);d.style.transform=pop?`scale(${.6+.4*back(p)})`:`translateY(${(1-ease(p))*50}px)`}
  const tb=SPEC.tintBeat;document.getElementById('tint').style.opacity=tb!=null&&t>=B[tb].start&&t<B[tb].end+.3?.55+.35*Math.sin((t-B[tb].start)*7):0;
  let c='';for(const x of B)if(t>=x.start-.05)c=x.cap||x.text;document.getElementById('cap').innerHTML=c?`<span>${c}</span>`:'';
};
render(0);
</script></body></html>
