<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--bg:#0b1020;--panel:#151c33;--ink:#f3f5fb;--mute:#8d97b5;--amber:#ffb020;--violet:#a78bfa;--teal:#2dd4bf;--red:#ff4d5e;--blue:#60a5fa}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Inter,sans-serif;color:var(--ink)}
#stage{position:absolute;inset:0}
#tint{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,77,94,.35),transparent 70%);opacity:0}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.035) 2px,transparent 2px);background-size:90px 90px}
.brand{position:absolute;top:70px;left:0;right:0;text-align:center;font:700 30px Inter;letter-spacing:6px;color:var(--mute);opacity:.7}
.scene{position:absolute;inset:0;opacity:0}
.a{position:absolute;opacity:0}
.kicker{left:0;right:0;text-align:center;font:600 34px Inter;letter-spacing:8px;color:var(--mute)}
.big{left:70px;right:70px;text-align:center;font:800 100px/1.05 "Inter Display",Inter;letter-spacing:-2px}
.mid{left:70px;right:70px;text-align:center;font:700 62px/1.15 "Inter Display",Inter}
.card{left:100px;right:100px;min-height:190px;border-radius:36px;background:var(--panel);border:4px solid;display:flex;align-items:center;gap:36px;padding:24px 46px;font:800 64px/1.1 "Inter Display",Inter}
.card .n{flex:none;width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 54px Inter;color:var(--bg)}
.chip{left:140px;right:140px;min-height:140px;padding:20px 30px;border-radius:30px;background:var(--panel);display:flex;align-items:center;justify-content:center;text-align:center;font:700 52px/1.2 Inter;border:3px solid rgba(255,255,255,.08)}
.chips{left:80px;right:80px;display:flex;justify-content:center;gap:26px}
.chips div{width:140px;height:140px;border-radius:28px;background:var(--panel);border:3px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font:800 60px "JetBrains Mono"}
.badge{right:90px;padding:16px 32px;border-radius:24px;font:800 52px "JetBrains Mono";background:#000;border:3px solid var(--mute);color:var(--ink)}
.warn{left:90px;right:90px;border-radius:32px;padding:36px 44px;background:rgba(255,77,94,.12);border:4px solid var(--red);font:700 54px/1.25 Inter;text-align:center}
#cap{position:absolute;left:60px;right:60px;bottom:150px;text-align:center;font:700 50px/1.25 Inter;color:#fff}
#cap span{background:rgba(0,0,0,.6);padding:6px 18px;border-radius:14px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
</style></head><body>
<div id="stage"><div class="grid"></div><div id="tint"></div><div class="brand">NOVAPROHOME</div><div id="scenes"></div><div id="cap"></div></div>
<script>
const SPEC={"slug": "leak-sensors-first-freeze", "title": "A Burst Pipe Usually Shows Up as a Wet Floor | Smart Home Fixes #4", "beats": [{"text": "First freeze is coming. A burst pipe usually announces itself with a wet floor.", "start": 0.49, "end": 4.264}, {"text": "Here's the 3-Spot Leak Check.", "start": 4.537, "end": 5.553}, {"text": "Leak sensors go under the water heater, under the sink, and behind the washer.", "start": 6.331, "end": 7.747}, {"text": "Water touches one, your phone gets an alert. Many also warn you when it's freezing.", "start_at": 9.84, "start": 9.84, "end": 12.913}, {"text": "Upgrade: an automatic shut-off closes the main water valve for you.", "start": 13.37, "end": 16.239}, {"text": "Which spot would you check first?", "start": 16.677, "end": 17.707}, {"text": "We're a small local business aiming for 100 subscribers by December 31. Subscribing helps a lot.", "start": 18.42, "end": 22.956}, {"text": "Follow for number 5: Thanksgiving guest Wi-Fi. Free quote at novaprohome.com.", "start": 23.303, "end": 26.753}], "scenes": [{"from": 0, "to": 0, "els": [{"t": "kicker", "top": 170, "html": "SMART HOME FIXES #4", "at": 0}, {"t": "mid", "top": 250, "html": "<svg width=\"760\" height=\"560\" viewBox=\"0 0 760 560\" style=\"display:block;margin:0 auto\"><rect width=\"760\" height=\"560\" rx=\"36\" fill=\"#0b1226\"/><rect x=\"120\" y=\"230\" width=\"520\" height=\"56\" rx=\"28\" fill=\"#8d97b5\"/><path d=\"M150 228 l10 -18 l10 18\" stroke=\"#cfe3ff\" stroke-width=\"5\" fill=\"none\"/><path d=\"M196 228 l10 -18 l10 18\" stroke=\"#cfe3ff\" stroke-width=\"5\" fill=\"none\"/><path d=\"M242 228 l10 -18 l10 18\" stroke=\"#cfe3ff\" stroke-width=\"5\" fill=\"none\"/><path d=\"M288 228 l10 -18 l10 18\" stroke=\"#cfe3ff\" stroke-width=\"5\" fill=\"none\"/><path d=\"M334 228 l10 -18 l10 18\" stroke=\"#cfe3ff\" stroke-width=\"5\" fill=\"none\"/><path d=\"M380 228 l10 -18 l10 18\" stroke=\"#cfe3ff\" stroke-width=\"5\" fill=\"none\"/><path d=\"M426 228 l10 -18 l10 18\" stroke=\"#cfe3ff\" stroke-width=\"5\" fill=\"none\"/><path d=\"M472 228 l10 -18 l10 18\" stroke=\"#cfe3ff\" stroke-width=\"5\" fill=\"none\"/><path d=\"M518 228 l10 -18 l10 18\" stroke=\"#cfe3ff\" stroke-width=\"5\" fill=\"none\"/><path d=\"M564 228 l10 -18 l10 18\" stroke=\"#cfe3ff\" stroke-width=\"5\" fill=\"none\"/><path d=\"M360 232 l20 54 l20 -54\" stroke=\"#0b1226\" stroke-width=\"10\" fill=\"none\"/><rect x=\"60\" y=\"520\" width=\"640\" height=\"10\" fill=\"#2a3358\"/><path d=\"M372 300 q-14 26 0 34 q14 -8 0 -34z\" fill=\"#60a5fa\"/><path d=\"M380 370 q-18 32 0 42 q18 -10 0 -42z\" fill=\"#60a5fa\"/><ellipse cx=\"380\" cy=\"500\" rx=\"210\" ry=\"28\" fill=\"#60a5fa\" opacity=\".55\"/><text x=\"380\" y=\"120\" fill=\"#cfe3ff\" font-size=\"44\" font-family=\"Inter\" font-weight=\"800\" text-anchor=\"middle\">\u2744 FIRST FREEZE</text></svg>", "at": 0}, {"t": "chip", "top": 880, "html": "Burst pipe = <span style='color:var(--blue)'>wet floor</span>", "at": 0, "d": 2.4}]}, {"from": 1, "to": 2, "els": [{"t": "big", "top": 280, "color": "blue", "html": "The 3-Spot<br>Leak Check", "at": 1, "pop": true}, {"t": "chip", "top": 640, "html": "1 \u00b7 Under the water heater", "at": 2, "d": 0.6}, {"t": "chip", "top": 810, "html": "2 \u00b7 Under the sink", "at": 2, "d": 1.8}, {"t": "chip", "top": 980, "html": "3 \u00b7 Behind the washer", "at": 2, "d": 2.8}]}, {"from": 3, "to": 3, "els": [{"t": "mid", "top": 200, "html": "<svg width=\"760\" height=\"560\" viewBox=\"0 0 760 560\" style=\"display:block;margin:0 auto\"><rect width=\"760\" height=\"560\" rx=\"36\" fill=\"#0b1226\"/><rect x=\"120\" y=\"230\" width=\"520\" height=\"56\" rx=\"28\" fill=\"#8d97b5\"/><path d=\"M150 228 l10 -18 l10 18\" stroke=\"#cfe3ff\" stroke-width=\"5\" fill=\"none\"/><path d=\"M196 228 l10 -18 l10 18\" stroke=\"#cfe3ff\" stroke-width=\"5\" fill=\"none\"/><path d=\"M242 228 l10 -18 l10 18\" stroke=\"#cfe3ff\" stroke-width=\"5\" fill=\"none\"/><path d=\"M288 228 l10 -18 l10 18\" stroke=\"#cfe3ff\" stroke-width=\"5\" fill=\"none\"/><path d=\"M334 228 l10 -18 l10 18\" stroke=\"#cfe3ff\" stroke-width=\"5\" fill=\"none\"/><path d=\"M380 228 l10 -18 l10 18\" stroke=\"#cfe3ff\" stroke-width=\"5\" fill=\"none\"/><path d=\"M426 228 l10 -18 l10 18\" stroke=\"#cfe3ff\" stroke-width=\"5\" fill=\"none\"/><path d=\"M472 228 l10 -18 l10 18\" stroke=\"#cfe3ff\" stroke-width=\"5\" fill=\"none\"/><path d=\"M518 228 l10 -18 l10 18\" stroke=\"#cfe3ff\" stroke-width=\"5\" fill=\"none\"/><path d=\"M564 228 l10 -18 l10 18\" stroke=\"#cfe3ff\" stroke-width=\"5\" fill=\"none\"/><path d=\"M360 232 l20 54 l20 -54\" stroke=\"#0b1226\" stroke-width=\"10\" fill=\"none\"/><rect x=\"60\" y=\"520\" width=\"640\" height=\"10\" fill=\"#2a3358\"/><path d=\"M372 300 q-14 26 0 34 q14 -8 0 -34z\" fill=\"#60a5fa\"/><path d=\"M380 370 q-18 32 0 42 q18 -10 0 -42z\" fill=\"#60a5fa\"/><ellipse cx=\"380\" cy=\"500\" rx=\"210\" ry=\"28\" fill=\"#60a5fa\" opacity=\".55\"/><rect x=\"300\" y=\"470\" width=\"160\" height=\"56\" rx=\"18\" fill=\"#e9edf7\"/><circle cx=\"380\" cy=\"498\" r=\"10\" fill=\"#2dd4bf\"/><text x=\"380\" y=\"455\" fill=\"#2dd4bf\" font-size=\"26\" font-family=\"Inter\" font-weight=\"800\" text-anchor=\"middle\">SENSOR</text><text x=\"380\" y=\"120\" fill=\"#cfe3ff\" font-size=\"44\" font-family=\"Inter\" font-weight=\"800\" text-anchor=\"middle\">\u2744 FIRST FREEZE</text></svg>", "at": 3, "pop": true}, {"t": "chip", "top": 820, "html": "\ud83d\udcf1 Leak detected: kitchen sink", "at": 3, "d": 0.6}, {"t": "chip", "top": 990, "html": "\u2744 Many also send low-temp alerts", "at": 3, "d": 2.2}]}, {"from": 4, "to": 4, "els": [{"t": "card", "top": 330, "color": "teal", "n": "+", "html": "Upgrade: automatic water shut-off", "at": 4}, {"t": "mid", "top": 640, "html": "Leak detected \u2192<br><span style='color:var(--teal)'>main valve closes</span>", "at": 4, "d": 1.6}]}, {"from": 5, "to": 7, "els": [{"t": "big", "top": 260, "html": "Which spot would you <span style='color:var(--blue)'>check first?</span>", "at": 5, "pop": true}, {"t": "chip", "top": 680, "html": "Goal: <b>100 subscribers</b> by Dec 31", "at": 6}, {"t": "mid", "top": 880, "html": "Follow for <b style='color:var(--teal)'>#5: Thanksgiving<br>guest Wi-Fi</b>", "at": 7}, {"t": "mid", "top": 1110, "html": "Free quote at<br><b style='color:var(--teal)'>novaprohome.com</b>", "at": 7, "d": 2.2}]}]};
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const B=SPEC.beats; // [{text,start,end}]
const root=document.getElementById('scenes');const scenes=[],els=[];
SPEC.scenes.forEach(sc=>{
  const s=document.createElement('div');s.className='scene';root.appendChild(s);
  const a=sc.from===0?-1:B[sc.from].start-0.05,b=sc.to+1<B.length?B[sc.to+1].start-0.15:1e9;scenes.push({s,a,b}); // first scene is on screen from frame 0
  sc.els.forEach(e=>{
    const d=document.createElement('div');d.className='a '+e.t;d.style.top=e.top+'px';
    if(e.color){d.style.borderColor=`var(--${e.color})`;if(e.t!=='card'&&e.t!=='chip'&&e.t!=='warn')d.style.color=`var(--${e.color})`}
    if(e.t==='card')d.innerHTML=`<div class="n" style="background:var(--${e.color})">${e.n}</div><div>${e.html}</div>`;
    else if(e.t==='chips')d.innerHTML=e.items.map(x=>`<div>${x}</div>`).join('');
    else if(e.t==='chip')d.innerHTML=`<div>${e.html}</div>`; // one flex child so inline spans don't split into columns
    else d.innerHTML=e.html;
    s.appendChild(d);
    els.push({d,t:e.at===0&&!e.d?-1:B[e.at].start+(e.d||0),pop:!!e.pop,dim:e.dimAt!=null?B[e.dimAt].start:null});
  });
});
window.render=function(t){
  for(const{s,a,b}of scenes){s.style.opacity=Math.max(0,Math.min(ease((t-a)/.3),1-ease((t-b)/.3)));s.style.transform=`translateY(${(1-ease((t-a)/.4))*40-ease((t-b)/.3)*40}px)`}
  for(const{d,t:ti,pop,dim}of els){const p=(t-ti)/.45;d.style.opacity=ease(p*1.6)*(dim!=null&&t>dim?.35:1);d.style.transform=pop?`scale(${.6+.4*back(p)})`:`translateY(${(1-ease(p))*50}px)`}
  const tb=SPEC.tintBeat;document.getElementById('tint').style.opacity=tb!=null&&t>=B[tb].start&&t<B[tb].end+.3?.55+.35*Math.sin((t-B[tb].start)*7):0;
  let c='';for(const x of B)if(t>=x.start-.05)c=x.cap||x.text;document.getElementById('cap').innerHTML=c?`<span>${c}</span>`:'';
};
render(0);
</script></body></html>
