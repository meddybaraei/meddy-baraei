<title>Seedline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Vazirmatn:wght@400;700;800&display=swap">
<style>
/* Layout: one calm app column; a sticky 5-step path; a conversation that becomes a plan and a daily routine. */
:root{
  --bg:#F3F6F6; --surface:#FFFFFF; --ink:#13232B; --muted:#56666D; --line:#D9E2E3;
  --teal:#1C6B67; --teal-soft:#E1EFED; --sun:#F2B33D; --sun-ink:#3A2600; --warn:#9A4A00; --warn-soft:#FFF1DF;
  --bubble-me:#13232B; --bubble-me-ink:#F3F6F6;
  --k-health:#2F7D4F; --k-family:#B24A6B; --k-biz:#1C6B67; --k-life:#6B6F2A; --k-mind:#5B4FA8;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1A1F; --surface:#15252B; --ink:#E7EFEF; --muted:#9DB0B4; --line:#26393F;
  --teal:#5FC2B9; --teal-soft:#183A3A; --sun:#F2B33D; --sun-ink:#2B1C00; --warn:#FFB869; --warn-soft:#33240F;
  --bubble-me:#E7EFEF; --bubble-me-ink:#0E1A1F;
  --k-health:#6FCF97; --k-family:#F28DAE; --k-biz:#5FC2B9; --k-life:#C9CF6B; --k-mind:#A99CF5; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1A1F; --surface:#15252B; --ink:#E7EFEF; --muted:#9DB0B4; --line:#26393F;
  --teal:#5FC2B9; --teal-soft:#183A3A; --sun:#F2B33D; --sun-ink:#2B1C00; --warn:#FFB869; --warn-soft:#33240F;
  --bubble-me:#E7EFEF; --bubble-me-ink:#0E1A1F;
  --k-health:#6FCF97; --k-family:#F28DAE; --k-biz:#5FC2B9; --k-life:#C9CF6B; --k-mind:#A99CF5; color-scheme:dark }
:root:lang(fa),:root:lang(ar){ --display:"Vazirmatn", Tahoma, sans-serif; --body:"Vazirmatn", Tahoma, sans-serif }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
.wrap{max-width:800px;margin:0 auto;padding-inline:16px;padding-block:16px 110px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:800;letter-spacing:-.02em}
:lang(fa) h1,:lang(ar) h1{letter-spacing:0}
h2{font-size:clamp(1.4rem,4vw,1.85rem);font-weight:700}
h3{font-size:1.12rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.label{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
:lang(fa) .label,:lang(ar) .label{letter-spacing:0;font-size:.85rem}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{border:0;border-radius:999px;padding:.72rem 1.35rem;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:.4rem .9rem;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:default}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.25rem;display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--ink);padding:0}
.seed{width:22px;height:22px;border-radius:50% 50% 50% 0;background:var(--sun);transform:rotate(-45deg)}
.langs{display:flex;gap:4px;flex-wrap:wrap}
.langs button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:.2rem .7rem;font-size:.9rem}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.step{flex:1 0 auto;display:flex;align-items:center;gap:6px;font-size:.84rem;color:var(--muted);padding:5px 9px;border-radius:10px;border:1px solid transparent;white-space:nowrap}
.step b{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line);font-size:.72rem;flex:none}
.step.on{color:var(--ink);border-color:var(--line);background:var(--surface)}
.step.on b{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.step.done b{background:var(--teal);border-color:var(--teal);color:var(--bg)}

/* home */
.hero{display:grid;gap:14px;margin-bottom:22px}
.hero p{font-size:1.1rem;max-width:60ch}
.starts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.start{text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:8px;color:var(--ink);align-content:start}
.start:hover{border-color:var(--teal)}
.start.main{border-color:var(--sun);box-shadow:0 0 0 3px color-mix(in srgb,var(--sun) 22%,transparent)}
.start .icon{width:40px;height:40px;border-radius:12px;background:var(--teal-soft);display:grid;place-items:center;color:var(--teal)}
.start .icon svg{width:22px;height:22px}
.section{margin-top:34px;display:grid;gap:12px}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.person{text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:6px;color:var(--ink);align-content:start}
.person:hover{border-color:var(--teal)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;color:var(--sun-ink);background:var(--sun)}
.person .role{font-size:.9rem;color:var(--muted)}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:6px;align-content:start}
.tcard .dot{width:10px;height:10px;border-radius:50%;background:var(--teal)}
.promise{background:var(--teal-soft);border-radius:18px;padding:18px;display:grid;gap:6px}
.founder{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.founder img{width:96px;height:96px;border-radius:50%;object-fit:cover;flex:none;border:3px solid var(--sun)}
.founder div{flex:1 1 260px;display:grid;gap:6px;min-width:0}
.founder blockquote{margin:0;font-size:1.02rem}

/* help strip */
.help{display:flex;gap:10px;align-items:flex-start;background:var(--teal-soft);border-radius:14px;padding:.7rem .9rem;margin-top:14px;font-size:.95rem}
.help svg{width:20px;height:20px;flex:none;color:var(--teal);margin-top:3px}

/* chat */
.chat{display:grid;gap:10px;margin-block:18px}
.msg{max-width:85%;padding:.7rem 1rem;border-radius:18px;animation:pop .35s ease both}
.msg.ai{background:var(--surface);border:1px solid var(--line);border-end-start-radius:6px;justify-self:start}
.msg.me{background:var(--bubble-me);color:var(--bubble-me-ink);border-end-end-radius:6px;justify-self:end}
.msg .who{display:block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.7;margin-bottom:2px}
.typing{justify-self:start;color:var(--muted);font-size:.92rem;padding-inline-start:6px}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.msg{animation:none}}
.composer{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.composer textarea{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:.7rem .9rem;resize:vertical;min-height:52px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}

/* uploads */
.drop{display:grid;gap:12px;background:var(--surface);border:2px dashed var(--line);border-radius:18px;padding:18px;margin-top:16px}
.drop.over{border-color:var(--teal)}
.filebtn{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumb{position:relative;width:96px;height:96px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;inset-block-start:4px;inset-inline-end:4px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);width:24px;height:24px;line-height:1;font-size:.9rem}
.filechip{display:inline-flex;gap:8px;align-items:center;background:var(--teal-soft);border-radius:999px;padding:.3rem .8rem;font-size:.92rem;max-width:100%}
.filechip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filechip button{border:0;background:none;color:var(--ink);font-weight:700}
textarea.paste{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:.7rem .9rem;min-height:120px;resize:vertical}
.privacy{font-size:.88rem;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.privacy svg{width:16px;height:16px;flex:none;margin-top:4px}

/* strengths */
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:18px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:10px;align-content:start}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--teal-soft);color:var(--ink);border-radius:999px;padding:.25rem .7rem;font-size:.92rem}

/* ideas */
.ideas{display:grid;gap:14px;margin-top:18px}
.idea{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:10px}
.idea.first{border-color:var(--sun);box-shadow:0 0 0 3px color-mix(in srgb,var(--sun) 25%,transparent)}
.idea-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.badge{background:var(--sun);color:var(--sun-ink);font-weight:700;font-size:.78rem;border-radius:999px;padding:.2rem .65rem;white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{border-top:1px solid var(--line);padding-top:6px;min-width:0}
.fact strong{display:block;font-variant-numeric:tabular-nums}
.safety{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:.6rem .8rem;font-size:.93rem}
.safety b{color:var(--warn)}
@media (max-width:520px){.facts{grid-template-columns:1fr}}

/* plan */
.plan{display:grid;gap:16px;margin-top:18px}
.namecard{background:var(--ink);color:var(--bg);border-radius:20px;padding:22px;display:grid;gap:6px}
.namecard .label{color:inherit;opacity:.7}
.namecard h2{font-size:clamp(1.6rem,5vw,2.3rem);font-family:"Bricolage Grotesque",var(--display)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;align-content:start}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checks input{width:20px;height:20px;margin-top:4px;accent-color:var(--teal);flex:none}
.checks input:checked + span{text-decoration:line-through;color:var(--muted)}
ol.plain,ul.plain{margin:0;padding-inline-start:1.2rem;display:grid;gap:6px}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}

/* day */
.dayhead{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:16px}
.ring{width:84px;height:84px;flex:none}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke:var(--teal);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring text{fill:var(--ink);font:700 18px "Bricolage Grotesque",sans-serif}
.dayhead div{flex:1 1 220px;min-width:0;display:grid;gap:4px}
.timeline{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.slot{display:grid;grid-template-columns:5.6rem 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.6rem .8rem;border-inline-start:5px solid var(--kc,var(--line))}
.slot time{font-variant-numeric:tabular-nums;font-weight:700;font-size:.92rem;color:var(--muted)}
.slot label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;min-width:0}
.slot input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--teal);flex:none}
.slot input:checked + span .t{text-decoration:line-through;color:var(--muted)}
.slot .kind{display:block;font-size:.75rem;font-weight:700;color:var(--kc)}
.slot .x{border:0;background:none;color:var(--muted);font-size:1.1rem;padding:0 .3rem}
.slot.done{background:color-mix(in srgb,var(--teal-soft) 60%,var(--surface))}
.k-health{--kc:var(--k-health)} .k-family{--kc:var(--k-family)} .k-biz{--kc:var(--k-biz)} .k-life{--kc:var(--k-life)} .k-mind{--kc:var(--k-mind)}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:flex-end}
.addrow input,.addrow select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:.55rem .7rem}
.addrow input[type=text]{flex:1 1 200px;min-width:0}
.cheer{background:var(--sun);color:var(--sun-ink);border-radius:14px;padding:.8rem 1rem;font-weight:700}
@media (max-width:480px){.slot{grid-template-columns:1fr auto}.slot time{grid-column:1/-1}}

/* edit + why + steps */
.editbtn{border:0;background:none;color:inherit;opacity:.8;font-size:.8rem;font-weight:700;text-decoration:underline;padding:0;cursor:pointer}
.msg .editbtn{display:block;margin-top:4px}
.edtext{width:100%;min-width:0;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:.5rem .6rem}
.msg.me .edtext{min-width:min(260px,60vw)}
.edrow{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.msg.me .btn:not(.ghost){background:var(--sun);color:var(--sun-ink)}
.msg.me .btn.ghost{color:var(--bubble-me-ink);border-color:currentColor}
.changed{background:var(--warn-soft);border-radius:12px;padding:.6rem .8rem;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:4px}
.chipx{border:0;background:none;color:var(--muted);font-size:1rem;line-height:1;padding:0 2px;cursor:pointer}
.chipadd{display:flex;gap:6px}
.chipadd input{flex:1;min-width:0;font:inherit;font-size:.92rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:.35rem .6rem}
.why{display:flex;gap:6px;font-size:.88rem;color:var(--muted);margin-top:2px}
.why svg{width:16px;height:16px;flex:none;margin-top:3px}
.adjust{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:8px}
.steplist{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.stepcard{border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.stepcard.open{border-color:var(--teal);background:var(--surface);box-shadow:0 0 0 2px color-mix(in srgb,var(--teal) 15%,transparent)}
.stephead{display:flex;gap:10px;align-items:flex-start;padding:10px 12px}
.stephead input{width:22px;height:22px;margin-top:4px;accent-color:var(--teal);flex:none}
.steptitle{flex:1;min-width:0;text-align:start;background:none;border:0;color:var(--ink);padding:0;display:grid;gap:2px;cursor:pointer}
.stepcard.done .st{text-decoration:line-through;color:var(--muted)}
.stephead .editbtn{margin-top:4px;color:var(--muted)}
.stepbody{padding:0 12px 14px;padding-inline-start:44px;display:grid;gap:10px}
.meta{display:flex;gap:16px;flex-wrap:wrap;font-size:.93rem}
.tipbox{background:var(--teal-soft);border-radius:12px;padding:.6rem .8rem;font-size:.93rem}
.slot .whyd{display:block;font-size:.8rem;color:var(--muted)}
.slotbtns{display:flex;gap:6px;align-items:center}
.slotbtns .editbtn{color:var(--muted)}
@media (max-width:480px){.stepbody{padding-inline-start:12px}}


/* voice + mobile */
.mic{flex:none}
.mic.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--warn) 25%,transparent)}}
@media (prefers-reduced-motion: reduce){.mic.on{animation:none}}
.edrow .mic,.actions .mic{width:40px;height:40px}
.mictip{background:var(--teal-soft);color:var(--ink);border-radius:12px;padding:.6rem .8rem;font-size:.92rem;margin-top:8px;flex-basis:100%}
@media (max-width:600px){
  input,select,textarea{font-size:16px!important}
  .coach.coach{inset-inline:8px;width:auto;height:min(72vh,600px)}
  .coachbtn{padding:.65rem 1rem}
  .btn{padding:.75rem 1.2rem}
  .btn.small{padding:.5rem .9rem}
}
.acchip{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted);margin-top:6px;flex-basis:100%}
.acchip button{border:0;background:none;color:var(--teal);font-weight:700;text-decoration:underline;padding:0;cursor:pointer;font-size:.85rem}
/* profile */
.know{background:var(--surface);border:1.5px dashed var(--teal);border-radius:18px;padding:16px;display:grid;gap:12px;margin-top:16px}
.pq{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.choices{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pchoice{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:.45rem .95rem;font-weight:700;font-size:.92rem;cursor:pointer}
.pchoice[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:.85rem;justify-self:start;padding:0;cursor:pointer}
.field{display:grid;gap:4px}
.pinput{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:.6rem .75rem;max-width:320px;min-width:0}
.welcome{display:grid;gap:14px;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.plist{display:grid;gap:10px;margin-top:12px}
.reality{border-inline-start:4px solid var(--warn);padding-inline-start:10px;font-size:.93rem}
/* day 1 */
.compare{margin-top:16px;display:grid;gap:8px}
.compare .tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.compare table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:520px}
.compare th,.compare td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.compare thead th{font-weight:700}
.compare tbody th{color:var(--muted);font-weight:700;white-space:nowrap}
.compare tbody tr:last-child>*{border-bottom:0}
.compare td{font-variant-numeric:tabular-nums}
.risk{display:inline-block;border-radius:999px;padding:.1rem .55rem;font-weight:700;font-size:.82rem}
.r-low{background:var(--teal-soft);color:var(--teal)} .r-medium{background:var(--warn-soft);color:var(--warn)} .r-high{background:var(--warn-soft);color:var(--warn);outline:1.5px solid var(--warn)}
.ruled{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:8px}
.difflist{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.difflist li{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.difflist svg{width:20px;height:20px;flex:none;color:var(--teal);margin-top:2px}
.difflink{color:var(--teal);font-weight:700}
/* workspace */

function micBtn(id){ const t=T(); return `<button type="button" class="iconbtn mic" data-mic="${id}" aria-label="${t.speak}" title="${t.speak}">${ICON.mic}</button>`; }
let rec=null, recBtn=null;
function micTip(b, ta){
  document.querySelectorAll(".mictip").forEach(x=>x.remove());
  const p=document.createElement("p"); p.className="mictip"; p.textContent=T().micTip;
  (b.closest(".edrow,.composer,.actions,.row")||b.parentElement).after(p);
  ta.focus();
}
function startMic(b){
  const ta=document.getElementById(b.dataset.mic); if(!ta) return;
  if(rec){ const same=recBtn===b; try{ rec.stop(); }catch{} if(same) return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return micTip(b, ta);
  let r; try{ r=new SR(); }catch{ return micTip(b, ta); }
  r.lang={en:"en-US",es:"es-US",fa:"fa-IR",ar:"ar-SA"}[S.lang]; r.interimResults=true; r.continuous=true;
  const base=ta.value?ta.value.trimEnd()+" ":"", ph=ta.placeholder; let got=false;
  r.onresult=e=>{ got=true; let txt=""; for(const x of e.results) txt+=x[0].transcript; ta.value=base+txt; ta.dispatchEvent(new Event("input")); };
  r.onerror=()=>{ if(!got) micTip(b, ta); };
  r.onend=()=>{ if(rec===r){ rec=null; recBtn=null; } b.classList.remove("on"); ta.placeholder=ph; if(!got) micTip(b, ta); };
  try{ r.start(); rec=r; recBtn=b; b.classList.add("on"); ta.placeholder=T().listening; setTimeout(()=>{ if(!got && rec===r){ try{ r.abort(); }catch{} rec=null; recBtn=null; b.classList.remove("on"); ta.placeholder=ph; micTip(b, ta); } }, 4000); }catch{ micTip(b, ta); }
}
document.addEventListener("click", e=>{ const b=e.target.closest("[data-mic]"); if(b){ e.preventDefault(); startMic(b); } });

/* ---------- correct as you go ---------- */
const AC = {timers:new WeakMap(), last:new WeakMap(), busy:new WeakSet()};
const AC_SEL = "#ans,#coachText,#adj,.edtext,#paste";
function acChip(ta){
  let c = ta._acchip;
  if(!c || !c.isConnected){ c=document.createElement("div"); c.className="acchip"; c.setAttribute("aria-live","polite"); (ta.closest(".row,.composer")||ta).insertAdjacentElement("afterend",c); ta._acchip=c; }
  return c;
}
async function acCorrect(ta){
  const text=ta.value; if(!ta.isConnected || AC.busy.has(ta)) return;
  if(text.trim().split(/\s+/).length<3 || text===AC.last.get(ta)) return;
  const sample = window.claude?.use ? await window.claude.use("sample").catch(()=>null) : null;
  if(!sample) return;
  const t=T(), chip=acChip(ta); chip.textContent=t.checking; AC.busy.add(ta);
  try{
    const r = await sample(`Fix spelling, punctuation, capitalization and obvious speech-to-text mistakes in the text below. Keep the text's own language (the app language is ${I18N[S.lang].name}), its meaning and the person's own words. Do not translate, shorten, add anything or answer it. Return only the corrected text.\n\nText:\n${text}`, {modelTier:"quick", cache:false});
    const fixed=(r.text||"").trim();
    AC.busy.delete(ta);
    if(!ta.isConnected){ return; }
    if(ta.value!==text || !fixed || fixed===text.trim()){ AC.last.set(ta, ta.value); chip.textContent=""; if(ta.value!==text) acSchedule(ta); return; }
    const before=text; ta.value=fixed; AC.last.set(ta, fixed);
    chip.innerHTML=""; const s1=document.createElement("span"); s1.textContent="✓ "+t.corrected; const u=document.createElement("button"); u.type="button"; u.textContent=t.undo;
    u.onclick=()=>{ ta.value=before; AC.last.set(ta,before); chip.textContent=""; ta.focus(); };
    chip.append(s1,u);
  }catch{ AC.busy.delete(ta); chip.textContent=""; }
}
function acSchedule(ta){ clearTimeout(AC.timers.get(ta)); AC.timers.set(ta, setTimeout(()=>acCorrect(ta), 1500)); }
document.addEventListener("input", e=>{ const ta=e.target; if(ta.matches?.(AC_SEL)) acSchedule(ta); });

function bubble(chat, who, text){
  const d=document.createElement("div"); const t=T();
  d.className="msg "+(who==="ai"?"ai":"me");
  d.innerHTML=`<span class="who">${who==="ai"?t.ai:esc(who)}</span><span class="txt"></span>`;
  d.querySelector(".txt").textContent=text;
  chat.appendChild(d); return d;
}
const clone = x => JSON.parse(JSON.stringify(x));
const isOwnUser = () => S.pi==="own" && (!S.ownPerson || S.ownPerson.own!==false);
function speaker(){ if(isOwnUser()) return T().you; return person().name; }
function locationOf(){ const p=person(); if(p?.location) return p.location; if(typeof S.pi==="number") return BASE[S.pi].loc; return S.own?.location||""; }
function syncConvo(){ if(typeof S.pi==="number" && !S.dirty) S.convo=person().chat.map(([q,a])=>({q,a})); }
let talkTimer=null;

function addEdit(d,i){
  const t=T(), b=document.createElement("button");
  b.type="button"; b.className="editbtn"; b.textContent=t.edit; d.appendChild(b);
  b.onclick=()=>{
    d.innerHTML=`<label class="sr" for="ed${i}">${t.edit}</label><textarea id="ed${i}" class="edtext" rows="3"></textarea><div class="edrow">${micBtn("ed"+i)}<button class="btn small" type="button">${t.save}</button><button class="btn small ghost" type="button">${t.cancel}</button></div>`;
    const ta=d.querySelector("textarea"); ta.value=S.convo[i].a; ta.focus();
    const [sv,cn]=d.querySelectorAll(".edrow .btn");
    sv.onclick=()=>{ const v=ta.value.trim(); if(v && v!==S.convo[i].a){ S.convo[i].a=v; S.dirty=true; if(S.own && S.convo[i].loc) S.own.location=v; } talkView(true); };
    cn.onclick=()=>talkView(true);
  };
}
function talkOwn(rerender){
  S.view="own"; S.pi="own"; setStep(0);
  const t=T(), Q=OWN_Q[S.lang], o=S.own;
  const qIdx = o.mode==="own" ? [0,1,2,3,4,5] : [1,4,5];
  const finish=()=>{ S.convo=qIdx.map((qi,k)=>({q:Q[qi],a:o.answers[k],loc:qi===5||undefined})); o.location=o.answers[qIdx.indexOf(5)]||""; talkView(); };
  if(o.answers.length>=qIdx.length) return S.convo?talkView():finish();
  app.innerHTML = `<h2>${t.yourConvo}</h2><p class="muted" style="margin-top:6px">${t.writeHow}</p>${helpBox(0)}
  <div class="chat" id="chat"></div>
  <form class="composer" id="form"><label for="ans" class="sr">${t.placeholder}</label>
    <textarea id="ans" rows="2" placeholder="${t.placeholder}"></textarea>
    ${micBtn("ans")}
    <button class="btn" type="submit">${t.send}</button></form>`;
  const chat=document.getElementById("chat"), form=document.getElementById("form"), ta=document.getElementById("ans");
  if(o.mode!=="own") bubble(chat,"ai",t.fewMore);
  o.answers.forEach((a,k)=>{ bubble(chat,"ai",Q[qIdx[k]]); bubble(chat,t.you,a); });
  bubble(chat,"ai",(o.answers.length===0&&S.profile.firstName?fmt(t.hi,{name:S.profile.firstName}):"")+Q[qIdx[o.answers.length]]);
  form.onsubmit=e=>{
    e.preventDefault(); const v=ta.value.trim(); if(!v) return;
    bubble(chat,t.you,v); o.answers.push(v); ta.value="";
    if(o.answers.length<qIdx.length) setTimeout(()=>bubble(chat,"ai",Q[qIdx[o.answers.length]]), reduce?0:350);
    else finish();
  };
  ta.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); form.requestSubmit(); }});
  if(!rerender) ta.focus();
}

let pdfReady=null;
function loadScript(src){ return new Promise((ok,bad)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=bad; document.head.appendChild(s); }); }
async function pdfText(file){
  if(!pdfReady) pdfReady = loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js").then(()=>loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"));
  await pdfReady;
  const doc = await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  let out=""; for(let n=1;n<=Math.min(doc.numPages,6);n++){ const c=await (await doc.getPage(n)).getTextContent(); out+=c.items.map(x=>x.str).join(" ")+"\n"; }
  return out.trim();
}
async function shrink(file){
  const bmp = await createImageBitmap(file); const k=Math.min(1,1280/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(b=>r(b),"image/jpeg",.85));
}
function uploadView(kind){
  S.view=kind==="resume"?"resume_up":kind; S.pi="own"; setStep(0);
  const t=T(), o=S.own, isResume=kind==="resume";
  app.innerHTML = `<h2>${isResume?t.resumeH:t.workH}</h2><p class="muted" style="margin-top:6px">${isResume?t.resumeP:t.workP}</p>${helpBox(0)}
  <div class="drop" id="drop">
    <div class="actions" style="margin-top:0">
      <label class="btn ghost filebtn" for="file">${isResume?ICON.doc:ICON.photo}<span>${isResume?t.chooseFile:t.choosePhotos}</span></label>
      <input id="file" class="sr" type="file" ${isResume?'accept="application/pdf,image/*,.txt"':'accept="image/*" multiple'}>
      <span class="muted" style="font-size:.9rem">${t.dropHint}</span>
    </div>
    <div id="files"></div>
    ${isResume?`<label for="paste" class="label">${t.pasteLabel}</label><textarea id="paste" class="paste">${esc(o.resumeText&&!o.fileName?o.resumeText:"")}</textarea>`:""}
    <p id="msg" class="muted" aria-live="polite"></p>
    ${privacyLine()}
  </div>
  <div class="actions"><button class="btn sun" type="button" id="go">${t.continue}</button><button class="btn ghost" type="button" id="back">${t.back}</button></div>`;
  const msg=document.getElementById("msg"), filesEl=document.getElementById("files");
  const draw=()=>{
    const thumbs=o.images.map((im,i)=>`<div class="thumb"><img src="${im.url}" alt=""><button type="button" data-r="${i}" aria-label="${t.remove}">×</button></div>`).join("");
    filesEl.innerHTML = (o.fileName?`<span class="filechip">${ICON.doc}<span>${esc(o.fileName)}</span><button type="button" id="rmf" aria-label="${t.remove}">×</button></span>`:"") + (thumbs?`<div class="thumbs" style="margin-top:8px">${thumbs}</div>`:"");
    filesEl.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ URL.revokeObjectURL(o.images[+b.dataset.r].url); o.images.splice(+b.dataset.r,1); draw(); });
    const rm=document.getElementById("rmf"); if(rm) rm.onclick=()=>{ o.fileName=""; o.resumeText=""; draw(); };
  };
  const add=async files=>{
    msg.textContent="";
    for(const f of files){
      if(f.type==="application/pdf"){ msg.textContent=t.readingFile; try{ o.resumeText=await pdfText(f); o.fileName=f.name; msg.textContent=o.resumeText?"":t.pdfFail; if(!o.resumeText) o.fileName=""; }catch{ msg.textContent=t.pdfFail; } }
      else if(f.type.startsWith("text/")){ o.resumeText=(await f.text()).slice(0,15000); o.fileName=f.name; }
      else if(f.type.startsWith("image/")){
        if(o.images.length>=4){ msg.textContent=t.tooMany; break; }
        try{ const blob=await shrink(f); o.images.push({blob, url:URL.createObjectURL(blob)}); }catch{ msg.textContent=t.pdfFail; }
      }
    }
    draw();
  };
  document.getElementById("file").onchange=e=>{ add([...e.target.files]); e.target.value=""; };
  const drop=document.getElementById("drop");
  drop.addEventListener("dragover",e=>{e.preventDefault(); drop.classList.add("over");});
  drop.addEventListener("dragleave",()=>drop.classList.remove("over"));
  drop.addEventListener("drop",e=>{e.preventDefault(); drop.classList.remove("over"); add([...e.dataTransfer.files]);});
  document.getElementById("go").onclick=()=>{
    const pasted=document.getElementById("paste")?.value.trim();
    if(pasted && !o.fileName) o.resumeText=pasted.slice(0,15000);
    if(!o.resumeText && !o.images.length){ msg.textContent=t.needSomething; return; }
    o.answers=[]; S.convo=null; S.ownPerson=null; S.dirty=false; talkOwn();
  };
  document.getElementById("back").onclick=home;
  draw();
}

const COMMON_RULES = loc => `- Write every text value in ${I18N[S.lang].name}. Short, plain sentences. No jargon.
- The goal is for this person to work for themselves and own a small business: self-employment, their own customers, their own brand. Do not suggest getting a job or working for an app platform as the business itself.
- The person lives in: ${loc||"unknown (assume the United States and say they should confirm local rules)"}. Base licenses, permits, registrations, insurance and any legal limits on that state, county and city. Name the real office to check with (for example the state corporation commission, the county or city business license office, the state licensing board, the health department). Never invent exact fees or form numbers; if you are not sure, say to confirm with that office.
- Never promise or estimate income or profit. Prices are what they would charge a customer, not what they will earn.`;
async function generate({images=false, feedback="", strengthsEdited=null}={}){
  const sample=await getSample();
  let imgs=[];
  if(images && S.own?.images?.length){
    const caps=await sample.limits().catch(()=>null);
    if(caps?.images) imgs=S.own.images.slice(0,caps.images.maxCount||4).map(x=>x.blob);
    else if(!S.own.resumeText) throw {code:"no_images"};
  }
  const cur = S.pi==="own"?S.ownPerson:(typeof S.pi==="number"?person():null);
  const convo=(S.convo||[]).map(x=>`Q: ${x.q}\nA: ${x.a}`).join("\n\n");
  const prompt = `You are Seedline, a warm, honest business coach for people who are new to AI and new to business (retail workers, salespeople, resellers, recent immigrants). Using everything below, find realistic small businesses this person could own, built on what they already know and have.

Rules:
${COMMON_RULES(locationOf())}
- Respect the profile below: transport, devices, where they like to work, comfort with selling and monthly budget must fit every idea.
- Give exactly 3 ideas, ordered from fastest and cheapest first customer to slowest. The first idea must be a simple service built on a skill they already have; mark only it startHere=true.
- Fit their stated time and budget.
- Be honest, not flattering. "realityCheck": 1-2 sentences on real demand where they live, nearby competition, and the main risk or reason it could fail.
- In "realityCheck", say how the idea fits what they shared: their transport, monthly budget, devices, where they like to work and how comfortable they are selling.
- "hoursPerWeek": a realistic [min, max] for the first month. "risk": how much money or stability they could lose.
- "ruledOut": exactly 2 ideas that might seem obvious for this person but don't fit, each with the honest reason (budget, car, license, time, comfort with selling).
- "weekendTest": one cheap way (under $50) to test real demand this weekend before spending more.
- Never use the word "passive" and never describe money as easy.
- "why" for each idea must point to something specific they said or showed.
- "strengthsWhy" explains, for each group, which of their answers it came from (one short sentence each).
- "safety": if an idea needs a license, permit or insurance in their location, or could be illegal without one (immigration legal advice, food sales, contracting, tax or financial advice, a conflict with a current employer), explain it in one or two plain sentences, name the office, and steer to a safe version. Otherwise null.
- Each plan has exactly 5 first-week steps (each doable in about 30 minutes), 3 places to find first customers, and 3 "grow" tools.
${imgs.length?`- ${imgs.length} photo(s) are attached showing this person's work or résumé. Use what you see as evidence of skills.\n`:""}
Return only JSON with this shape:
{"firstName": string or "", "strengths": {"skills": [string], "have": [string], "people": [string], "timeMoney": [string]},
 "strengthsWhy": {"skills": string, "have": string, "people": string, "timeMoney": string},
 "ideas": [{"title": string, "pitch": string, "why": string, "firstDollar": string, "startCost": string, "price": string, "startHere": boolean, "safety": string or null, "realityCheck": string, "weekendTest": string, "hoursPerWeek": [number, number], "risk": "low" or "medium" or "high",
   "plan": {"name": string, "offer": string, "steps": [string], "firstCustomers": [string], "grow": [string]}}],
 "ruledOut": [{"title": string, "reason": string}]}
${S.own?.resumeText&&S.pi==="own"?`\nRésumé text:\n${S.own.resumeText.slice(0,12000)}\n`:""}${strengthsEdited?`\nThe person edited their strengths map. Treat it as true and build on it:\n${JSON.stringify(strengthsEdited)}\n`:""}${profileText()}${feedback&&cur?`\nThe person saw these ideas: ${cur.ideas.map(i=>i.title).join("; ")}. They asked for these changes: ${feedback}\nGive 3 ideas that respect this.\n`:""}
Conversation:
${convo}`;
  const r = await sample.json(prompt, imgs.length?{modelTier:"default",images:imgs}:{modelTier:"default"});
  if(!r || !Array.isArray(r.ideas) || !r.strengths) throw {code:"invalid_json"};
  return r;
}
function applyResult(r){

  const persona = cur && (cur.own===false || typeof S.pi==="number") ? cur : null;

    initial:(persona?.name||r.firstName||"Y")[0], strengths:r.strengths, strengthsWhy:r.strengthsWhy||null, ideas:r.ideas.slice(0,3), ruledOut:Array.isArray(r.ruledOut)?r.ruledOut.slice(0,2):null, generated:true };
  S.pi="own"; S.dirty=false; S.strDirty=false; S.idea=0; S.openStep=null; S.convoSaved=clone(S.convo||[]);

  if(q.type==="one") ctl=`<div class="choices">${q.opts.map(o=>`<button type="button" class="pchoice" data-pq="${q.id}" data-pv="${o}" aria-pressed="${v===o}">${t.pq.opts[o]}</button>`).join("")}</div>`;
  else if(q.type==="multi") ctl=`<div class="choices">${q.opts.map(o=>`<button type="button" class="pchoice" data-pm="${q.id}" data-pv="${o}" aria-pressed="${Array.isArray(v)&&v.includes(o)}">${t.pq.opts[o]}</button>`).join("")}<button type="button" class="btn small" data-psave="${q.id}">${t.save}</button></div>`;
  else ctl=`<div class="choices"><label class="sr" for="pq-${q.id}">${t.pq.q[q.id]}</label><input id="pq-${q.id}" class="pinput" type="${q.type==="time"?"time":"text"}" value="${esc(answered(v)?v:(q.type==="time"?"07:00":""))}">${q.type==="text"?micBtn("pq-"+q.id):""}<button type="button" class="btn small" data-psave="${q.id}">${t.save}</button></div>`;
  return `<div class="pq"><strong>${t.pq.q[q.id]}</strong>${ctl}<span class="why">${ICON.info}<span>${t.pq.why[q.id]}</span></span>${noSkip?"":`<button type="button" class="linkbtn" data-pskip="${q.id}">${t.skip}</button>`}</div>`;
}

function profileText(){
  if(!isOwnUser()) return "";
  const p=S.profile, en=I18N.en.pq, parts=[];

  if(p.age) parts.push(`Age: ${p.age}${+p.age<18?" (a minor: any registration, accounts or payments need a parent or guardian)":""}`);
  if(p.dream) parts.push(`Their dream: ${p.dream}`); if(p.dreamWhy) parts.push(`Why it matters to them: ${p.dreamWhy}`);

function wakeShift(hm){
  const w=S.profile.wake; if(!isOwnUser() || !answered(w)) return hm;
  const [wh,wm]=w.split(":").map(Number), [h,m]=hm.split(":").map(Number);
  let mins=h*60+m+(wh*60+wm-420); mins=Math.max(0,Math.min(23*60+59,mins));
  return String(Math.floor(mins/60)).padStart(2,"0")+":"+String(mins%60).padStart(2,"0");
}

function ideaMeta(p,i){
  const d=p.ideas[i];
  if(Array.isArray(d.hoursPerWeek) || d.risk) return {hours:d.hoursPerWeek, risk:d.risk};
  const pi = typeof S.pi==="number" ? S.pi : BASE.findIndex(b=>b.id===p.id);
  const m = pi>=0 && !p.own && !p.generated ? PERSONA_META[pi]?.[i] : null;
  return m ? {hours:m[0], risk:m[1]} : {};
}
function ruledOutOf(p){
  if(Array.isArray(p.ruledOut)) return p.ruledOut.map(r=>[r.title,r.reason]);
  const pi = typeof S.pi==="number" ? S.pi : BASE.findIndex(b=>b.id===p.id);
  return pi>=0 && !p.own && !p.generated ? (RULED[S.lang]||RULED.en)[pi] : [];
}
function compareTable(p){
  const t=T(), hrs=h=>Array.isArray(h)&&h.length===2?`${num(h[0])}–${num(h[1])}`:"—";
  const metas=p.ideas.map((d,i)=>ideaMeta(p,i));
  if(!metas.some(m=>m.hours||m.risk)) return "";
  const row=(label,cells)=>`<tr><th scope="row">${label}</th>${cells.map(c=>`<td>${c}</td>`).join("")}</tr>`;
  return `<section class="compare"><h3>${t.compareH}</h3><div class="tablewrap"><table>
    <thead><tr><th></th>${p.ideas.map(d=>`<th scope="col">${esc(d.title)}${d.startHere?` <span class="badge">${t.startHere}</span>`:""}</th>`).join("")}</tr></thead>

      ${row(t.fFirst,p.ideas.map(d=>esc(d.firstDollar)))}
      ${row(t.fCost,p.ideas.map(d=>esc(d.startCost)))}
      ${row(t.fPrice,p.ideas.map(d=>esc(d.price)))}

    </tbody></table></div></section>`;

const PF={db:null, ok:true, mem:[], urls:[]};
function pfOpen(){ return new Promise(res=>{ try{ const r=indexedDB.open("seedline",1); r.onupgradeneeded=()=>r.result.createObjectStore("files",{keyPath:"id"}); r.onsuccess=()=>{ PF.db=r.result; res(PF.db); }; r.onerror=()=>{ PF.ok=false; res(null); }; }catch{ PF.ok=false; res(null); } }); }
async function pfTx(mode, fn){ const db=PF.db||await pfOpen(); if(!db) return null; return new Promise(res=>{ try{ const tx=db.transaction("files",mode); const st=tx.objectStore("files"); const out=fn(st); tx.oncomplete=()=>res(out?.result ?? true); tx.onerror=()=>{ PF.ok=false; res(null); }; }catch{ PF.ok=false; res(null); } }); }
async function pfAll(){ const r=await pfTx("readonly", st=>st.getAll()); return (Array.isArray(r)?r:PF.mem).slice().sort((a,b)=>b.added-a.added); }
async function pfPut(item){ const r=await pfTx("readwrite", st=>st.put(item)); if(r===null){ PF.mem=PF.mem.filter(x=>x.id!==item.id); PF.mem.push(item); } }
async function pfDel(id){ await pfTx("readwrite", st=>st.delete(id)); PF.mem=PF.mem.filter(x=>x.id!==id); }

let pdfLibs=null, zipLib=null;
async function resumePdf(sheet){
  if(!pdfLibs) pdfLibs=loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js").then(()=>loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"));
  await pdfLibs;
  const clone=sheet.cloneNode(true); clone.removeAttribute("id"); clone.classList.add("printing");
  clone.style.cssText="position:fixed;left:-10000px;top:0;width:816px;max-width:none;margin:0;box-shadow:none;border:0;border-radius:0;padding:48px 56px";
  document.body.append(clone);
  let canvas; try{ canvas=await window.html2canvas(clone,{scale:2, backgroundColor:"#ffffff", windowWidth:900}); } finally { clone.remove(); }
  const { jsPDF }=window.jspdf, pdf=new jsPDF({unit:"pt", format:"letter"});
  const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight(), m=36, w=pw-2*m;
  const pageH=Math.floor(canvas.width*(ph-2*m)/w);
  for(let y=0, first=true; y<canvas.height; y+=pageH, first=false){
    const part=document.createElement("canvas"); part.width=canvas.width; part.height=Math.min(pageH, canvas.height-y);
    part.getContext("2d").drawImage(canvas,0,y,canvas.width,part.height,0,0,canvas.width,part.height);
    if(!first) pdf.addPage();
    pdf.addImage(part.toDataURL("image/jpeg",0.92),"JPEG",m,m,w,part.height*w/canvas.width);
  }
  return pdf.output("blob");
}
async function resumeDocx(r, rtl){
  if(!zipLib) zipLib=loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
  await zipLib;
  const t=T(), x=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const bidi=rtl?"<w:bidi/>":"", rr=rtl?"<w:rtl/>":"";
  const para=(text,{bold=false,size=22,bullet=false,space=80,color=""}={})=>`<w:p><w:pPr>${bidi}<w:spacing w:after="${space}"/>${bullet?`<w:ind w:left="360" w:hanging="220"/>`:""}</w:pPr><w:r><w:rPr>${rr}${bold?"<w:b/>":""}${color?`<w:color w:val="${color}"/>`:""}<w:sz w:val="${size}"/></w:rPr><w:t xml:space="preserve">${bullet?"• ":""}${x(text)}</w:t></w:r></w:p>`;
  const head=s=>para(s.toUpperCase(),{bold:true,size:22,space:60,color:"1C6B67"});
  let body=para(r.name,{bold:true,size:36,space:40})+para(r.headline,{size:24,space:40})+para(r.contact,{size:20,space:200,color:"555555"});
  body+=head(t.secSummary)+para(r.summary,{space:200});
  if(r.experience?.length){ body+=head(t.secExp); r.experience.forEach(e=>{ body+=para(`${e.title} — ${e.org}${e.place?", "+e.place:""}`,{bold:true,space:20})+para(e.dates||"",{size:20,color:"555555",space:60}); (e.bullets||[]).forEach(b=>body+=para(b,{bullet:true,space:40})); body+=para("",{space:80}); }); }
  if(r.projects?.length){ body+=head(t.secProj); r.projects.forEach(p=>body+=para(`${p.name}: ${p.detail}`,{space:60})); }
  if(r.skills?.length) body+=head(t.secSkills)+para(r.skills.join(", "),{space:160});
  if(r.languages?.length) body+=head(t.secLang)+para(r.languages.join(", "),{space:160});
  if(r.education?.length){ body+=head(t.secEdu); r.education.forEach(e=>body+=para(`${e.school}${e.detail?" — "+e.detail:""}${e.dates?" ("+e.dates+")":""}`,{space:60})); }
  if(r.certifications?.length) body+=head(t.secCert)+para(r.certifications.join(", "));
  const zip=new window.JSZip();
  zip.file("[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`);
  zip.file("_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  zip.file("word/document.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1080" w:right="1080" w:bottom="1080" w:left="1080" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>`);
  return zip.generateAsync({type:"blob", mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

const KITS={loading:{}, err:{}, tried:{}};
const MSG_KINDS=["text","whatsapp","facebook","flyer"];
function kitKey(){ const p=person(), d=p.ideas[S.idea]; return "seedline-kit-"+S.lang+"-"+hash(d.title+"|"+(d.plan?.offer||"")+"|"+locationOf()); }
function isVirginia(loc){ return /\bVA\b|virginia|ویرجینیا|فيرجينيا/i.test(loc||""); }
function stateOf(loc){ const m=String(loc||"").match(/,\s*([A-Za-z .]+?)\s*(?:\d{5})?\s*$/); return m?m[1].trim():""; }
function basicKit(){
  const t=T(), p=person(), d=p.ideas[S.idea], pl=d.plan||{}, v={name:pl.name||d.title, offer:pl.offer||d.pitch||"", price:d.price||""};
  const messages={}; MSG_KINDS.forEach(k=>messages[k]=fmt(t.tmpl[k],v));
  return {basic:true, names:[{name:v.name, why:""}], messages, flyer:{headline:v.name, bullets:[], cta:""}, price:null};
}
async function loadKit(){
  const key=kitKey(); if(KITS.loading[key]) return;
  KITS.loading[key]=true; KITS.tried[key]=true; delete KITS.err[key]; if(S.view==="kit") kitView(true);
  try{
    const sample=await getSample(); const p=person(), d=p.ideas[S.idea], pl=d.plan||{};
    const prompt=`You are Seedline, an honest small-business coach for beginners. Make a launch kit so this person can tell people about their new business today.
Rules:
${COMMON_RULES(locationOf())}
- Never promise income or results. Never use the word "passive". No hype, no fake urgency, no made-up reviews or numbers of customers.
- Messages must sound like a real person talking to people who know them, warm and simple. Use "{contact}" where their phone or contact should go only in the flyer, nowhere else.
- Prices are estimates for where they live; say so honestly.

Business idea: ${d.title}. ${d.pitch||""}. Current name: ${pl.name||""}. Offer: ${pl.offer||""}. Their plan price: ${d.price||""}. Cost to start: ${d.startCost||""}.
About the person: ${JSON.stringify(p.strengths||{})}${profileText()}

Return only JSON:
{"names":[{"name":"a short business name","why":"why it fits, 1 sentence"}],
 "messages":{"text":"a text message to a friend or neighbor, 2-3 sentences","whatsapp":"a message for a WhatsApp group of people who know them, 3-4 sentences, at most 1 emoji","facebook":"a Facebook post for their own page, 4-5 sentences, asks people to share","flyer":"flyer text, 4 short lines separated by \\n"},
 "flyer":{"headline":"business name or a 3-6 word headline","bullets":["3 short benefits, each under 8 words"],"cta":"short call to action"},
 "price":{"low":"lower price in their area","typical":"typical price in their area","high":"higher price in their area","start":"a fair starting price for a beginner","why":"why that starting price, 1-2 sentences","covers":["3 to 4 costs the price must cover, for example materials, gas, time, platform fees"]}}
"names" has exactly 4 items and the first item is the current name "${pl.name||d.title}" (keep it unless it is hard to spell). All prices in US dollars with the unit (per hour, per item, per visit).`;
    const r=await sample.json(prompt,{modelTier:"default"});
    if(!r || !r.messages || !Array.isArray(r.names)) throw {code:"invalid_json"};
    store.set(key,r);
  }catch(e){ KITS.err[key]=e; }
  KITS.loading[key]=false;
  if(S.view==="kit") kitView(true);
}
function flyerHtml(k, pl, d){
  const contact=S.profile.contact||"";
  return `<div class="flyer" id="flyer" dir="${T().dir}"><div class="flyerseed" aria-hidden="true"></div>
    <h3>${esc(k.flyer?.headline||pl.name)}</h3><p class="flyeroffer">${esc(pl.offer||"")}</p>
    ${(k.flyer?.bullets||[]).length?`<ul>${k.flyer.bullets.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>`:""}
    <p class="flyerprice">${esc(k.price?.start||d.price||"")}</p>
    ${k.flyer?.cta?`<p class="flyercta">${esc(k.flyer.cta)}</p>`:""}
    <p class="flyercontact">${esc(contact)||"&nbsp;"}</p></div>`;
}

        <div class="choices"><button type="button" class="btn small" data-copy="${m}">${t.copy}</button>${m==="whatsapp"?`<a class="btn small ghost" target="_blank" rel="noopener" data-wa href="https://wa.me/?text=${encodeURIComponent(k.messages?.whatsapp||"")}">${t.openWa}</a>`:""}<span class="muted" data-copymsg="${m}" aria-live="polite"></span></div></div>`).join("")}
    </section>

    </section>
    <section class="box"><h3>${t.priceH}</h3><p class="muted" style="font-size:.93rem">${t.priceP}</p>
      ${k.price?`<div class="pricerow"><div><span class="label">${t.priceLow}</span><b>${esc(k.price.low)}</b></div><div><span class="label">${t.priceTyp}</span><b>${esc(k.price.typical)}</b></div><div><span class="label">${t.priceHigh}</span><b>${esc(k.price.high)}</b></div></div>
        <div class="namecard"><span class="label">${t.priceStart}</span><h2>${esc(k.price.start)}</h2><p>${esc(k.price.why||"")}</p></div>

  </div>
  <div class="actions"><button class="btn sun" type="button" id="kday">${t.planDay}</button><button class="btn ghost" type="button" id="kback">${t.back}</button></div>`;
  app.querySelectorAll("[data-kitai]").forEach(b=>b.onclick=loadKit);
  app.querySelectorAll("[data-usename]").forEach(b=>b.onclick=()=>{
    const n=(k.names||[])[+b.dataset.usename]?.name; if(!n) return; const old=pl.name;
    ensureCopy().ideas[S.idea].plan.name=n;
    const cur=store.get(key); if(cur){ if(old) MSG_KINDS.forEach(m=>{ if(cur.messages?.[m]) cur.messages[m]=cur.messages[m].split(old).join(n); }); if(cur.flyer?.headline===old) cur.flyer.headline=n; store.set(key,cur); }
    kitView(true);
  });
  app.querySelectorAll("[data-msg]").forEach(ta=>ta.oninput=()=>{
    const cur=store.get(key)||basicKit(); (cur.messages ||= {})[ta.dataset.msg]=ta.value; store.set(key,cur);
    if(ta.dataset.msg==="whatsapp"){ const a=app.querySelector("[data-wa]"); if(a) a.href="https://wa.me/?text="+encodeURIComponent(ta.value); }
  });
  app.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{
    const m=b.dataset.copy, ta=document.getElementById("msg-"+m), out=app.querySelector(`[data-copymsg="${m}"]`);
    try{ await navigator.clipboard.writeText(ta.value); out.textContent=t.copied; }catch{ ta.focus(); ta.select(); }
  });
  const ci=document.getElementById("contactin");
  ci.oninput=()=>{ S.profile.contact=ci.value.trim(); saveProfile(); const f=app.querySelector(".flyercontact"); if(f) f.textContent=ci.value.trim()||" "; };
  const fm=document.getElementById("flyermsg");
  const flyerBlob=async()=>{
    if(!pdfLibs) pdfLibs=loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js").then(()=>loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"));
    await pdfLibs;
    const el=document.getElementById("flyer"), clone=el.cloneNode(true); clone.removeAttribute("id");
    clone.style.cssText="position:fixed;left:-10000px;top:0;width:600px;max-width:none;margin:0";
    document.body.append(clone);
    let canvas; try{ canvas=await window.html2canvas(clone,{scale:2, backgroundColor:null}); } finally { clone.remove(); }
    return new Promise(res=>canvas.toBlob(res,"image/png"));
  };
  const fname=()=>(pl.name||"flyer").replace(/[\\/:*?"<>|]+/g,"").trim().slice(0,40)+" flyer.png";
  document.getElementById("saveflyer").onclick=async()=>{ fm.textContent=t.flyerSaving; try{ await saveDownload(fname(), await flyerBlob()); fm.textContent=t.flyerDone; }catch(e){ fm.textContent=e?.code==="declined"?"":t.flyerFail; } };
  document.getElementById("flyerpf").onclick=async()=>{ fm.textContent=t.flyerSaving; try{ const b=await flyerBlob(); await pfPut({id:"f"+Date.now(), name:fname(), type:"image/png", size:b.size, blob:b, step:t.kitH, note:"", added:Date.now()}); fm.textContent=t.addedPf; }catch{ fm.textContent=t.flyerFail; } };
  document.getElementById("practice").onclick=()=>openCoachWith(fmt(t.practicePrefill,{name:pl.name||d.title, offer:pl.offer||""}));
  document.getElementById("kday").onclick=()=>day();
  document.getElementById("kback").onclick=()=>plan();
  if(!saved && !loading && !err && !KITS.tried[key] && window.claude?.use) loadKit();
}

    const r = await sample(msgs, {modelTier:"default", cache:false, ...(images.length?{images}:{}), onText:({text})=>{ live=text; const last=document.querySelector("#coachLog .typing"); if(last) last.textContent=text||t.thinking; }});
    reply(r.text||live);
  }catch(err){
    reply(err?.code==="not_granted"?t.errPerm:err?.code==="rate_limited"?t.errRate:(err?.text||t.errGeneric));
  }
};

async function superState(){
  const p=S.pi!=null?person():null, d=p?.ideas?.[S.idea], week=p&&d?(store.get(planKey()+"-week")||[]):[];
  const files=await pfAll().catch(()=>[]);
  const st={ screen:S.view, appLanguage:I18N[S.lang].name,
    profile:Object.fromEntries(Object.entries(S.profile).filter(([k,v])=>k!=="welcomed"&&v!=="__skip")),
    journey: p?{ person: p.own?"the user":p.name, location: locationOf(), chosenIdea: d?.title||null, businessName: d?.plan?.name||null,
      planSteps:(d?.plan?.steps||[]).map((s,i)=>({n:i+1, text:s, done:!!week[i]})) }:null,
    agents: AG.list.map(a=>({name:a.name, goal:a.goal})),
    portfolio: files.slice(0,30).map(f=>({file:f.name, step:f.step, note:f.note||""})),
    resume: RS.data?{name:RS.data.name, headline:RS.data.headline, summary:RS.data.summary, skills:RS.data.skills}:null,
    myDayAddedTasks: agentTasks().map(x=>x.text).slice(-10) };
  return JSON.stringify(st).slice(0,12000);
}
function propose(label, apply){
  return new Promise(resolve=>{
    C.log.push({role:"action", label, state:"pending", apply, resolve});
    drawCoach();
  });
}
const SECTION_GO = { home:()=>home(), strengths:()=>strengths(), ideas:()=>ideas(), plan:()=>plan(), day:()=>day(), package:()=>packageView(), kit:()=>kitView(), advisor:()=>advisorView(), agents:()=>agentsView(), portfolio:()=>portfolioView(), resume:()=>resumeView(), profile:()=>profileView(), dream:()=>dreamView() };
function superTools(){
  const t=T(), needPlan=()=>{ const p=S.pi!=null?person():null, d=p?.ideas?.[S.idea]; if(!d?.plan) throw new Error("The person has not chosen an idea and plan yet."); return d.plan; };
  return [
    {name:"add_to_my_day", description:"Propose adding one task to the person's daily routine (My day). The person approves or skips. Returns whether it was approved.",
     inputSchema:{type:"object",properties:{text:{type:"string",description:"The task, short, in the person's language"},time:{type:"string",description:"24h time HH:MM, default 18:00"},kind:{type:"string",enum:["biz","health","family","life","mind"]}},required:["text"]},
     execute:async({text,time,kind})=>{ text=String(text||"").slice(0,160); if(!text) throw new Error("text is required");
       const ok=await propose(fmt(t.act.addDay,{x:text}),()=>{ const l=agentTasks(); l.push({id:"a"+Date.now(), time:/^\d{2}:\d{2}$/.test(String(time))?String(time):"18:00", kind:["biz","health","family","life","mind"].includes(kind)?kind:"biz", text}); store.set("seedline-agent-tasks",l); });
       return ok?"approved and added":"the person skipped it"; }},
    {name:"create_agent", description:"Propose creating a personal AI agent with a goal. The person approves or skips. Returns whether it was created.",
     inputSchema:{type:"object",properties:{name:{type:"string"},goal:{type:"string"},tone:{type:"string",enum:["friendly","direct","patient"]},instructions:{type:"string"}},required:["name","goal"]},
     execute:async({name,goal,tone,instructions})=>{ name=String(name||"").slice(0,60); goal=String(goal||"").slice(0,240); if(!name||!goal) throw new Error("name and goal are required");
       const ok=await propose(fmt(t.act.newAgent,{x:name}),()=>{ AG.list.push({id:"ag"+Date.now(), name, goal, tone:["friendly","direct","patient"].includes(tone)?tone:"friendly", extra:String(instructions||"").slice(0,600), log:[]}); saveAgents(); if(S.view==="agents") agentsView(); });
       return ok?"approved and created":"the person skipped it"; }},
    {name:"update_plan_step", description:"Propose changing the text of one first-week plan step (1-based step number). Returns whether it was approved.",
     inputSchema:{type:"object",properties:{step:{type:"number"},text:{type:"string"}},required:["step","text"]},
     execute:async({step,text})=>{ const pl=needPlan(), i=Number(step)-1; text=String(text||"").slice(0,240); if(!(i>=0&&i<pl.steps.length)||!text) throw new Error("invalid step or text");
       const ok=await propose(fmt(t.act.stepEdit,{n:num(i+1),x:text}),()=>{ ensureCopy().ideas[S.idea].plan.steps[i]=text; if(S.view==="plan") plan(true); });
       return ok?"approved and changed":"the person skipped it"; }},
    {name:"mark_step_done", description:"Propose marking a first-week plan step done or not done (1-based). Returns whether it was approved.",
     inputSchema:{type:"object",properties:{step:{type:"number"},done:{type:"boolean"}},required:["step"]},
     execute:async({step,done})=>{ const pl=needPlan(), i=Number(step)-1; if(!(i>=0&&i<pl.steps.length)) throw new Error("invalid step"); const v=done!==false;
       const ok=await propose(fmt(v?t.act.stepDone:t.act.stepUndone,{n:num(i+1)}),()=>{ const s=store.get(planKey()+"-week")||[]; s[i]=v; store.set(planKey()+"-week",s); if(S.view==="plan") plan(true); });
       return ok?"approved":"the person skipped it"; }},
    {name:"update_profile", description:"Propose updating one profile answer. Fields: firstName, dream (their dream, text), dreamWhy (why it matters), goal (text), wake (HH:MM), transport (car|transit|walk|rides), devices (phone|computer|both), place (home|out|mix), people (love|ok|rather), monthly (m0|m50|m200|mmore). Returns whether it was approved.",
     inputSchema:{type:"object",properties:{field:{type:"string"},value:{type:"string"}},required:["field","value"]},
     execute:async({field,value})=>{ field=String(field); value=String(value||"").slice(0,200); const q=PQ.find(x=>x.id===field);
       if(!["firstName","dream","dreamWhy"].includes(field) && !q) throw new Error("unknown field"); if(q?.type==="one" && !q.opts.includes(value)) throw new Error("value must be one of "+q.opts.join(", "));
       const shown = ["firstName","dream","dreamWhy"].includes(field)?value : `${t.pq.q[field]} ${q.type==="one"?t.pq.opts[value]:value}`;
       const ok=await propose(fmt(t.act.profile,{x:shown}),()=>{ S.profile[field]=value; saveProfile(); });
       return ok?"approved":"the person skipped it"; }},
    {name:"add_portfolio_note", description:"Propose adding or replacing the note on one portfolio file, matched by file name. Returns whether it was approved.",
     inputSchema:{type:"object",properties:{file:{type:"string"},note:{type:"string"}},required:["file","note"]},
     execute:async({file,note})=>{ const files=await pfAll(); const f=files.find(x=>x.name===String(file))||files.find(x=>x.name.toLowerCase().includes(String(file).toLowerCase())); if(!f) throw new Error("no such file");
       const ok=await propose(fmt(t.act.pfNote,{x:f.name}),async()=>{ f.note=String(note).slice(0,500); await pfPut(f); if(S.view==="portfolio") portfolioView(); });
       return ok?"approved":"the person skipped it"; }},
    {name:"update_resume", description:"Propose a change to the résumé. part: headline | summary | add_skill | add_bullet (adds a bullet to experience entry index, 0-based). Only use facts the person gave. Returns whether it was approved.",
     inputSchema:{type:"object",properties:{part:{type:"string",enum:["headline","summary","add_skill","add_bullet"]},text:{type:"string"},experience:{type:"number"}},required:["part","text"]},
     execute:async({part,text,experience})=>{ if(!RS.data) throw new Error("No résumé yet. Suggest building it in the Résumé section."); text=String(text||"").slice(0,400);
       const ok=await propose(fmt(t.act.resume,{x:text}),()=>{ const r=RS.data;
         if(part==="headline") r.headline=text; else if(part==="summary") r.summary=text; else if(part==="add_skill") (r.skills ||= []).push(text);
         else { const e=r.experience?.[Number(experience)||0]; if(e) (e.bullets ||= []).push(text); }
         store.set("seedline-resume",r); if(S.view==="resume") resumeView(); });
       return ok?"approved":"the person skipped it"; }},
    {name:"open_section", description:"Take the person to a part of the app right away (no approval needed). section: home | strengths | ideas | plan | day | package | kit (launch kit: names, ready-to-send messages, flyer, prices, practice) | advisor (one-page summary to bring to a free SBDC/SCORE advisor, local rules, free help finder by ZIP) | agents | portfolio | resume | profile | dream.",
     inputSchema:{type:"object",properties:{section:{type:"string"}},required:["section"]},
     execute:async({section})=>{ const go=SECTION_GO[String(section)]; if(!go) throw new Error("unknown section");
       if(["strengths","ideas","plan","day","package","kit","advisor"].includes(section) && S.pi==null) throw new Error("The person hasn't started a journey yet.");
       if(["plan","day","package","kit","advisor"].includes(section) && !person()?.ideas?.[S.idea]?.plan) throw new Error("No plan chosen yet.");
       go(); C.log.push({role:"action", label:fmt(t.act.open,{x:section}), state:"applied"}); drawCoach(); return "opened"; }}
  ];
}
async function superSubmit(e){
  e.preventDefault(); if(C.busy) return;
  const t=T(), ta=document.getElementById("coachText"); const q=ta.value.trim();
  if(!q && !C.img) return;
  const img=C.img; C.img=null; ta.value="";
  // tell the model what happened to proposals since its last reply
  const since=[]; for(let i=C.log.length-1;i>=0 && C.log[i].role!=="assistant";i--){ if(C.log[i].role==="action" && C.log[i].state!=="pending") since.unshift(`${C.log[i].label} → ${C.log[i].state}`); }
  C.log.push({role:"user", content:(q||"(screenshot attached)")+(since.length?`\n(Since your last reply: ${since.join("; ")})`:""), shown:q||"📷", img:img?.url});
  C.busy=true; drawCoach();
  const reply=txt=>{ C.busy=false; C.log.push({role:"assistant", content:txt}); drawCoach(); };
  let sample; try{ sample=await getSample(); }catch(err){ return reply(errMsg(err)); }
  const caps=await sample.limits().catch(()=>null);
  let images=[]; if(img){ if(caps?.images) images=[img.blob]; else return reply(t.noImages); }
  const useTools=!!caps?.tools;
  const system=`You are Seedline AI, the one assistant for everything in Seedline: a platform that helps people who are new to AI and new to business turn their life experience into a small business of their own, with a plan, a daily routine, personal agents, a portfolio and a résumé.
- Answer in the language the person writes in; if unsure use ${I18N[S.lang].name}. Plain words, short answers, one or two next steps.
- Be honest, never flattering. Never promise income or use the word "passive". Flag anything needing a license, permit, lawyer or other professional, and point to free local help (SBDC, SCORE, library) when a person is needed. You are an AI and say so if asked.
- Help them work toward their OWN dream (in their profile) instead of only working for someone else: connect today's step to that dream and encourage them honestly. Never pressure anyone to quit a job; the safe path is building on the side until their readiness checklist is done.
- If a screenshot or photo is attached, say in one line what you see, then what to do next.
${useTools?`- You can act in the app with your tools. Changes are only PROPOSED: the person taps "Do it" or "Skip". Propose at most 3 changes per reply, only when they help, and say in your reply what you proposed. Never change things the person didn't ask about. open_section moves them right away.`:"- You cannot change the app in this view; tell the person where to tap instead."}
Current state of their Seedline (JSON):
${await superState()}`;
  const convo=C.log.filter(m=>m.role==="user"||m.role==="assistant");
  const msgs=convo.map((m,i)=>({role:m.role, content: i===0 ? system+"\n\nTheir message: "+m.content : m.content}));
  try{
    const opts={modelTier:"default", onText:({text})=>{ const el=document.querySelector("#coachLog .typing"); if(el) el.textContent=text||t.thinking; }};
    if(images.length) opts.images=images;
    if(useTools) opts.tools=superTools(); else opts.cache=false;
    const r=await sample(msgs, opts);
    C.log.forEach(m=>{ if(m.role==="action" && m.state==="pending"){ m.state="skipped"; m.resolve?.(false); } });
    reply(r.text||"");
  }catch(err){ C.log.forEach(m=>{ if(m.role==="action" && m.state==="pending"){ m.state="skipped"; m.resolve?.(false); } }); reply(err?.code==="not_granted"?t.errPerm:err?.code==="rate_limited"?t.errRate:(err?.text||t.errGeneric)); }
}
function actionCard(m){
  const t=T(), d=document.createElement("div"); d.className="actcard "+m.state;
  const lab=document.createElement("div"); lab.innerHTML=m.state==="pending"?`<span class="label">${t.propose}</span>`:""; const txt=document.createElement("strong"); txt.textContent=m.label; lab.append(txt); d.append(lab);
  if(m.state==="pending"){
    const row=document.createElement("div"); row.className="edrow";
    const y=document.createElement("button"); y.type="button"; y.className="btn small sun"; y.textContent=t.approve;
    const n=document.createElement("button"); n.type="button"; n.className="btn small ghost"; n.textContent=t.skip;
    y.onclick=async()=>{ m.state="applied"; try{ await m.apply(); }catch{} m.resolve(true); drawCoach(); };
    n.onclick=()=>{ m.state="skipped"; m.resolve(false); drawCoach(); };
    row.append(y,n); d.append(row);
  } else { const s=document.createElement("span"); s.className="actstate"; s.textContent=m.state==="applied"?"✓ "+t.applied:t.skipped; d.append(s); }
  return d;
}
